name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Найти папку с игрой
        id: src
        run: |
          if [ -f public/index.html ]; then
            echo "dir=public" >> "$GITHUB_OUTPUT"
          elif [ -f index.html ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "index.html не найден ни в public/, ни в корне"; exit 1
          fi

      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Упаковать
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.src.outputs.dir }}

      - name: Выложить
        id: deployment
        uses: actions/deploy-pages@v5
